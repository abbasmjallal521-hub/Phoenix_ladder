<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سلّم الفينيكس</title>
<meta name="theme-color" content="#130E1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Single dark theme: ember on deep plum, poster headline */
:root{
  --bg:#130E1C; --bg2:#1C1428; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
  --fg:#F4EEF7; --muted:#A99BB5; --ember:#FF6A2B; --gold:#FFB648; --up:#4CD9A0; --up-soft:rgba(76,217,160,.14);
  --slot:rgba(255,255,255,.07); --down:#FF6B6B; --flame:linear-gradient(135deg,#FF4E2B 0%,#FF8A2B 45%,#FFC14D 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);font:15px/1.65 "Tajawal",system-ui,-apple-system,sans-serif;
  background:radial-gradient(120% 60% at 50% -10%,rgba(255,106,43,.22),transparent 60%),linear-gradient(var(--bg),var(--bg2));background-attachment:fixed}
.wrap{max-width:500px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
header{text-align:center;position:relative}
.lang{position:absolute;top:0;inset-inline-end:0;background:var(--card);color:var(--fg);border:1px solid var(--line);font-size:.8rem;padding:6px 12px;border-radius:99px}
h1{font:400 2.1rem/1.1 "Lalezar","Tajawal",sans-serif;margin:0;background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
h2{font:700 1.02rem "Tajawal",sans-serif;margin:0}
.sub{color:var(--muted);font-size:.82rem}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero{text-align:center;gap:4px;padding:24px 18px;border-color:rgba(255,138,43,.35)}
.hero .n{font:400 5.5rem/1 "Lalezar",sans-serif;background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .l{color:var(--muted);font-weight:500}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:7px;margin-top:14px}
.slot{aspect-ratio:1;border-radius:50%;background:var(--slot);display:grid;place-items:center;font-size:.72rem;color:var(--muted);font-weight:700}
.slot.on{background:var(--flame);color:#2A1206;box-shadow:0 0 14px rgba(255,120,43,.45)}
.slot.ms{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.big{font:400 2.2rem/1.1 "Lalezar",sans-serif;color:var(--fg)}
.bar{height:12px;background:var(--slot);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--flame);border-radius:99px;transition:width .7s}
.t{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.t:first-of-type{border-top:0}
.pill{font-size:.78rem;font-weight:700;padding:4px 12px;border-radius:99px;white-space:nowrap}
.done{background:var(--up-soft);color:var(--up)}
.next{background:rgba(255,138,43,.16);color:var(--gold)}
.later{background:var(--slot);color:var(--muted)}
.day{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .amt{color:var(--up);font-weight:700}
.day .amt.z{color:var(--muted);font-weight:400}
.tag{font-size:.74rem;color:var(--gold);font-weight:700}
.note{font-size:.8rem;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:.78rem;display:flex;flex-direction:column;gap:6px;align-items:center}
.msg{background:rgba(255,138,43,.14);border:1px solid rgba(255,138,43,.3);border-radius:14px;padding:12px;font-size:.92rem;text-align:center}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
.full{grid-column:1/-1}
input{font:inherit;font-size:16px;color:var(--fg);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--flame);color:#2A1206}
button:disabled{opacity:.6}
.link{background:none;color:var(--muted);font-weight:500;font-size:.8rem;padding:4px 8px;text-decoration:underline}
.del{background:none;color:var(--muted);font-weight:500;font-size:.8rem;padding:4px 8px}
.del.arm{color:var(--down)}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
details summary{cursor:pointer;font:700 1.02rem "Tajawal",sans-serif;list-style:none}
details summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* celebration */
#party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,rgba(255,90,30,.35),rgba(19,14,28,.85) 70%);cursor:pointer}
#party canvas{position:absolute;inset:0;width:100%;height:100%}
#party .boom{position:relative;text-align:center;padding:0 24px;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
#party .bird{font-size:5.5rem;line-height:1;filter:drop-shadow(0 0 24px rgba(255,120,40,.9));animation:flap 1s ease-in-out infinite alternate}
#party .head{font:400 2.6rem/1.15 "Lalezar",sans-serif;background:var(--flame);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:10px}
#party .line{font-size:1.15rem;font-weight:700;color:var(--fg);margin-top:6px}
#party .tap{font-size:.8rem;color:var(--muted);margin-top:18px}
.shake{animation:shake .5s ease-in-out 2}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flap{from{transform:translateY(0) rotate(-6deg) scale(1)}to{transform:translateY(-10px) rotate(6deg) scale(1.08)}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,-1px)}}
@media (prefers-reduced-motion:reduce){#party .boom,#party .bird,.shake{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <button class="lang" type="button" id="langBtn" aria-label="Language">EN</button>
    <h1 id="name">سلّم الفينيكس</h1>
    <div class="sub"><span data-i="perAcc">كل حساب</span> <span class="num" id="size">$200</span> · <span data-i="auto">بتتحدّث لحالها</span></div>
  </header>

  <div class="msg" id="msg" hidden></div>

  <!-- recorder only -->
  <section class="card" id="addCard" hidden>
    <h2 data-i="addTitle">سجّل سحب اليوم</h2>
    <form id="addForm">
      <label><span data-i="date">التاريخ</span><input id="fDate" type="date" required></label>
      <label><span data-i="amt">الربح يلي سحبته ($)</span><input id="fAmt" type="number" inputmode="decimal" min="0" step="0.01" data-ip="amtPh" placeholder="مثلاً 85" required></label>
      <label class="full"><span data-i="note">ملاحظة (اختياري)</span><input id="fNote" maxlength="80" data-ip="notePh" placeholder="مثلاً: يوم خسارة"></label>
      <button class="full" type="submit" id="addBtn" data-i="save">سجّل</button>
    </form>
  </section>

  <section class="card hero">
    <div class="n num" id="acc">–</div>
    <div class="l" data-i="accNow">حساب هلق</div>
    <div class="ladder" id="ladder"></div>
  </section>

  <section class="card">
    <div class="row"><span data-i="wallet">بالواليت</span><span class="sub"><span data-i="left">باقي</span> <span class="num" id="remain">–</span> <span data-i="toNext">للحساب الجاي</span></span></div>
    <div class="big num" id="wallet">–</div>
    <div class="bar"><i id="bar"></i></div>
  </section>

  <section class="card" id="targets"></section>

  <section class="card">
    <div class="row"><h2 data-i="days">آخر الأيام</h2><span class="sub"><span data-i="total">المجموع</span> <span class="num" id="total">–</span></span></div>
    <div id="days"><div class="note" data-i="loading">عم يحمّل…</div></div>
  </section>

  <!-- recorder only -->
  <details class="card" id="setCard" hidden>
    <summary data-i="settings">الإعدادات</summary>
    <form id="setForm">
      <label class="full"><span data-i="planName">اسم الخطة</span><input id="xName" maxlength="40"></label>
      <label><span data-i="startAcc">كم حساب بلّشنا فيهن</span><input id="xAcc" type="number" inputmode="numeric" min="0"></label>
      <label><span data-i="startWal">واليت البداية ($)</span><input id="xWal" type="number" inputmode="decimal" min="0" step="0.01"></label>
      <label><span data-i="accSize">حجم الحساب ($)</span><input id="xSize" type="number" inputmode="decimal" min="1"></label>
      <label><span data-i="targetsL">التارغتات</span><input id="xT" inputmode="numeric" placeholder="5, 13"></label>
      <button class="full" type="submit" data-i="saveSet">احفظ</button>
    </form>
  </details>

  <div class="foot">
    <span id="upd"></span>
    <button class="link" type="button" id="loginBtn">دخول المسجّل</button>
    <form id="loginForm" hidden style="grid-template-columns:1fr auto;width:100%;max-width:320px">
      <input id="pw" type="password" data-ip="pwPh" placeholder="كلمة السر" autocomplete="current-password">
      <button type="submit" data-i="enter">دخول</button>
    </form>
  </div>
</main>
<div id="party" hidden>
  <canvas id="fx"></canvas>
  <div class="boom">
    <div class="bird">🔥</div>
    <div class="head" id="pHead"></div>
    <div class="line" id="pLine"></div>
    <div class="tap" id="pTap"></div>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
var money = function(v){ return "$" + (Math.round(v * 100) / 100).toLocaleString("en-US"); };
var L = {
  ar: { perAcc:"كل حساب", auto:"بتتحدّث لحالها", addTitle:"سجّل سحب اليوم", date:"التاريخ", amt:"الربح يلي سحبته ($)", amtPh:"مثلاً 85",
    note:"ملاحظة (اختياري)", notePh:"مثلاً: يوم خسارة", save:"سجّل", accNow:"حساب هلق", wallet:"بالواليت", left:"باقي", toNext:"للحساب الجاي",
    days:"آخر الأيام", total:"المجموع", loading:"عم يحمّل…", settings:"الإعدادات", planName:"اسم الخطة", startAcc:"كم حساب بلّشنا فيهن",
    startWal:"واليت البداية ($)", accSize:"حجم الحساب ($)", targetsL:"التارغتات", saveSet:"احفظ", pwPh:"كلمة السر", enter:"دخول",
    login:"دخول المسجّل", logout:"طلوع من وضع المسجّل", targets:"التارغتات", target:"التارغت", accounts:"حسابات", reached:"✓ وصلنا",
    remain:function(n){ return "باقي " + n + " حساب"; }, later:"بعدين", noDays:"لسا ما في أيام مسجّلة.", newAcc:function(n){ return "+" + n + " حساب جديد"; },
    del:"امسح", sure:"أكيد؟", updated:"آخر تحديث ", saving:"عم يحفظ… (أول مرة بالنهار ممكن تاخد دقيقة)", saved:"انسجّل ✓", setSaved:"انحفظ ✓",
    wait:"لحظة…", badPw:"كلمة السر غلط", noNet:"ما قدرت أجيب الأرقام، تأكد من النت.", err:"صار خطأ، جرّب كمان مرة",
    pHead:"حساب جديد!", pLine:function(n){ return "صاروا " + n + " حسابات 🚀"; }, pTarget:function(n){ return "🏆 وصلنا التارغت: " + n + " حسابات!"; }, pTap:"اكبس لتكمّل",
    ord:["الأول","التاني","التالت","الرابع","الخامس","السادس"] },
  en: { perAcc:"Each account", auto:"Updates automatically", addTitle:"Log today's withdrawal", date:"Date", amt:"Profit withdrawn ($)", amtPh:"e.g. 85",
    note:"Note (optional)", notePh:"e.g. losing day", save:"Log it", accNow:"accounts now", wallet:"In the wallet", left:"", toNext:"left to the next account",
    days:"Recent days", total:"Total", loading:"Loading…", settings:"Settings", planName:"Plan name", startAcc:"Starting accounts",
    startWal:"Starting wallet ($)", accSize:"Account size ($)", targetsL:"Targets", saveSet:"Save", pwPh:"Password", enter:"Enter",
    login:"Recorder login", logout:"Leave recorder mode", targets:"Targets", target:"Target", accounts:"accounts", reached:"✓ Reached",
    remain:function(n){ return n + " to go"; }, later:"Later", noDays:"No days logged yet.", newAcc:function(n){ return "+" + n + " new account" + (n > 1 ? "s" : ""); },
    del:"Delete", sure:"Sure?", updated:"Updated ", saving:"Saving… (first save of the day can take a minute)", saved:"Logged ✓", setSaved:"Saved ✓",
    wait:"One moment…", badPw:"Wrong password", noNet:"Couldn't load the numbers. Check your connection.", err:"Something went wrong, try again",
    pHead:"New account!", pLine:function(n){ return "We're at " + n + " accounts 🚀"; }, pTarget:function(n){ return "🏆 Target hit: " + n + " accounts!"; }, pTap:"Tap to continue",
    ord:["1","2","3","4","5","6"] }
};
var lang = "ar";
try { lang = localStorage.getItem("pl-lang") || "ar"; } catch(e) {}
function t(k){ return L[lang][k]; }
function applyLang(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-ip]").forEach(function(el){ el.placeholder = t(el.dataset.ip); });
  $("langBtn").textContent = lang === "ar" ? "EN" : "عربي";
  render();
}
// Where things live. API = the Render web service that saves; DATA = the file in GitHub that everyone reads.
var API = "https://phoenix-ladder-api.onrender.com";
var DATA = "https://api.github.com/repos/abbasmjallal521-hub/Phoenix_ladder/contents/data.json?ref=main";
var RAW = "https://raw.githubusercontent.com/abbasmjallal521-hub/Phoenix_ladder/main/data.json";
var D = null, pw = null;
try { pw = localStorage.getItem("pl-pw"); D = JSON.parse(localStorage.getItem("pl-data") || "null"); if (D) D._cached = true; } catch(e) {}
function keep(j){ D = j; try { localStorage.setItem("pl-data", JSON.stringify(j)); } catch(e) {} }
// wake the save server in the background so recording is quick when needed
function wake(){ fetch(API + "/api/ping", { mode: "no-cors", cache: "no-store" }).catch(function(){}); }

function msg(t){ var m = $("msg"); m.textContent = t || ""; m.hidden = !t; }
function today(){ var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }

function post(action, body){
  body = body || {}; body.password = pw;
  return fetch(API + "/api/" + action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(r.status === 401 ? t("badPw") : t("err")); return j; }); });
}

function render(){
  if (!D) return;
  var acc = +D.startAccounts || 0, wal = +D.startWallet || 0, size = +D.size || 200, total = 0, days = [];
  D.entries.slice().sort(function(a,b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; }).forEach(function(e){
    total += e.amt; wal += e.amt; var o = 0;
    while (wal >= size) { wal -= size; acc++; o++; }
    days.push({ id: e.id, d: e.d, a: e.amt, note: e.note, opened: o });
  });
  var T = D.targets || [5, 13];
  $("name").textContent = D.name; document.title = D.name;
  $("size").textContent = money(size);
  $("acc").textContent = acc;
  var top = Math.max(acc, T[T.length - 1] || acc), h = "";
  for (var i = 1; i <= top; i++) h += '<div class="slot' + (i <= acc ? " on" : "") + (T.indexOf(i) >= 0 ? " ms" : "") + '">' + i + "</div>";
  $("ladder").innerHTML = h;
  $("wallet").textContent = money(wal);
  $("remain").textContent = money(size - wal);
  $("bar").style.width = Math.min(100, wal / size * 100) + "%";
  $("total").textContent = money(total);

  var found = false, ORD = t("ord"), th = "<h2>" + t("targets") + "</h2>";
  T.forEach(function(tg, k){
    var cls = acc >= tg ? "done" : (!found ? (found = true, "next") : "later");
    var txt = acc >= tg ? t("reached") : t("remain")(tg - acc);
    th += '<div class="t"><span>' + t("target") + " " + (ORD[k] || k + 1) + ': <b class="num">' + tg + "</b> " + t("accounts") + '</span><span class="pill ' + cls + '">' + txt + "</span></div>";
  });
  th += '<div class="t"><span>' + t("target") + " " + (ORD[T.length] || "") + '</span><span class="pill later">' + t("later") + "</span></div>";
  $("targets").innerHTML = th;

  var admin = !!pw, box = $("days"); box.textContent = "";
  var list = days.slice().reverse().slice(0, admin ? 60 : 10);
  if (!list.length) { var nd = document.createElement("div"); nd.className = "note"; nd.textContent = t("noDays"); box.appendChild(nd); }
  list.forEach(function(d){
    var row = document.createElement("div"); row.className = "day";
    var left = document.createElement("div");
    var dt = document.createElement("div"); dt.className = "num"; dt.textContent = d.d; left.appendChild(dt);
    if (d.opened) { var tg = document.createElement("div"); tg.className = "tag"; tg.textContent = t("newAcc")(d.opened); left.appendChild(tg); }
    if (d.note) { var n = document.createElement("div"); n.className = "note"; n.textContent = d.note; left.appendChild(n); }
    var right = document.createElement("div"); right.style.cssText = "display:flex;align-items:center;gap:4px";
    var am = document.createElement("span"); am.className = "amt num" + (d.a ? "" : " z"); am.textContent = money(d.a); right.appendChild(am);
    if (admin) { var del = document.createElement("button"); del.className = "del"; del.type = "button"; del.textContent = t("del"); del.dataset.id = d.id; right.appendChild(del); }
    row.appendChild(left); row.appendChild(right); box.appendChild(row);
  });

  $("addCard").hidden = !admin; $("setCard").hidden = !admin;
  $("loginBtn").textContent = admin ? t("logout") : t("login");
  if (admin && !$("fDate").value) $("fDate").value = today();
  if (admin && document.activeElement.form !== $("setForm")) {
    $("xName").value = D.name; $("xAcc").value = D.startAccounts; $("xWal").value = D.startWallet; $("xSize").value = D.size; $("xT").value = T.join(", ");
  }
  if (D && !D._cached) checkParty(acc);
  $("upd").textContent = t("updated") + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

function load(){
  fetch(DATA, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" })
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .catch(function(){ return fetch(RAW + "?t=" + Date.now()).then(function(r){ if (!r.ok) throw 0; return r.json(); }); })
    .then(function(j){ keep(j); msg(""); render(); })
    .catch(function(){ if (!D) msg(t("noNet")); });
}

$("addForm").addEventListener("submit", function(ev){
  ev.preventDefault();
  var btn = $("addBtn"); btn.disabled = true; msg(t("saving"));
  post("entry", { d: $("fDate").value, amt: $("fAmt").value, note: $("fNote").value.trim() })
    .then(function(j){ keep(j); $("fAmt").value = ""; $("fNote").value = ""; render(); msg(t("saved")); setTimeout(function(){ msg(""); }, 2500); })
    .catch(function(e){ msg(e.message); })
    .finally(function(){ btn.disabled = false; });
});

$("days").addEventListener("click", function(ev){
  var b = ev.target.closest(".del"); if (!b) return;
  if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent = t("sure"); setTimeout(function(){ b.classList.remove("arm"); b.textContent = t("del"); }, 3000); return; }
  post("delete", { id: b.dataset.id }).then(function(j){ keep(j); render(); }).catch(function(e){ msg(e.message); });
});

$("setForm").addEventListener("submit", function(ev){
  ev.preventDefault();
  post("settings", {
    name: $("xName").value.trim(), startAccounts: $("xAcc").value, startWallet: $("xWal").value, size: $("xSize").value,
    targets: $("xT").value.split(/[,،\s]+/).map(Number).filter(function(n){ return n > 0; })
  }).then(function(j){ keep(j); render(); msg(t("setSaved")); setTimeout(function(){ msg(""); }, 2500); }).catch(function(e){ msg(e.message); });
});

$("loginBtn").addEventListener("click", function(){
  if (pw) { pw = null; try { localStorage.removeItem("pl-pw"); } catch(e) {} render(); return; }
  $("loginForm").hidden = !$("loginForm").hidden;
  if (!$("loginForm").hidden) { $("loginForm").style.display = "grid"; $("pw").focus(); }
});

$("loginForm").addEventListener("submit", function(ev){
  ev.preventDefault();
  var p = $("pw").value;
  msg(t("wait"));
  fetch(API + "/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: p }) })
    .then(function(r){
      if (!r.ok) throw new Error(t("badPw"));
      pw = p; try { localStorage.setItem("pl-pw", p); } catch(e) {}
      $("pw").value = ""; $("loginForm").hidden = true; $("loginForm").style.display = ""; msg(""); render();
    }).catch(function(e){ msg(e.message); });
});


// ---- celebration: fire, embers and confetti when the account count goes up ----
var partyTimer = null, raf = null;
function celebrate(acc, hitTarget){
  var box = $("party"), cv = $("fx"), ctx = cv.getContext("2d");
  $("pHead").textContent = hitTarget ? "🏆" + " " + t("pHead") : t("pHead");
  $("pLine").textContent = hitTarget ? t("pTarget")(acc) : t("pLine")(acc);
  $("pTap").textContent = t("pTap");
  box.hidden = false;
  document.querySelector(".hero").classList.remove("shake"); void document.body.offsetWidth;
  document.querySelector(".hero").classList.add("shake");
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) { partyTimer = setTimeout(endParty, 3500); return; }
  var dpr = Math.min(window.devicePixelRatio || 1, 2), W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  var cols = ["#FF4E2B","#FF8A2B","#FFC14D","#FFE08A","#4CD9A0","#FFFFFF"], P = [];
  function burst(x, y, n){
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = (4 + Math.random() * 9) * dpr;
      P.push({ k: "c", x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6 * dpr, s: (4 + Math.random() * 6) * dpr,
               r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.random() * cols.length | 0], life: 1 });
    }
  }
  burst(W / 2, H * .45, 140); setTimeout(function(){ burst(W * .2, H * .35, 70); }, 350); setTimeout(function(){ burst(W * .8, H * .35, 70); }, 650);
  var start = performance.now();
  function frame(now){
    var el = now - start; ctx.clearRect(0, 0, W, H);
    // fire wall rising from the bottom
    if (el < 3200) for (var i = 0; i < 9; i++) P.push({ k: "f", x: Math.random() * W, y: H + 10 * dpr, vx: (Math.random() - .5) * 1.5 * dpr,
      vy: -(3 + Math.random() * 6) * dpr, s: (14 + Math.random() * 26) * dpr, life: 1 });
    ctx.globalCompositeOperation = "lighter";
    for (var j = P.length - 1; j >= 0; j--) {
      var p = P[j];
      if (p.k === "f") {
        p.x += p.vx + Math.sin((p.y + el) / (40 * dpr)) * dpr; p.y += p.vy; p.life -= .014; p.s *= .985;
        var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s);
        g.addColorStop(0, "rgba(255,230,150," + (.9 * p.life) + ")"); g.addColorStop(.4, "rgba(255,120,40," + (.6 * p.life) + ")"); g.addColorStop(1, "rgba(255,60,20,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill();
      } else {
        p.vy += .25 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;
        ctx.save(); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = Math.max(p.life, 0);
        ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      }
      if (p.life <= 0 || p.y > H + 60 * dpr) P.splice(j, 1);
    }
    ctx.globalCompositeOperation = "source-over";
    if (el < 5000 || P.length) raf = requestAnimationFrame(frame); else endParty();
  }
  raf = requestAnimationFrame(frame);
  partyTimer = setTimeout(endParty, 6000);
}
function endParty(){ cancelAnimationFrame(raf); clearTimeout(partyTimer); $("party").hidden = true; }
$("party").addEventListener("click", endParty);
function checkParty(acc){
  var seen = null; try { seen = localStorage.getItem("pl-seen"); } catch(e) {}
  try { localStorage.setItem("pl-seen", String(acc)); } catch(e) {}
  if (seen === null || acc <= +seen) return;
  var T = (D && D.targets) || [], hit = T.some(function(x){ return x > +seen && x <= acc; });
  celebrate(acc, hit);
}
$("langBtn").addEventListener("click", function(){ lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("pl-lang", lang); } catch(e) {} applyLang(); });
applyLang();
load();
wake();
setInterval(function(){ if (!document.hidden) load(); }, 120000);
document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });
